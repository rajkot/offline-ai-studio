name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
  pull_request:
    branches: [master]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Next.js static export
        working-directory: website
        run: npm run build
        env:
          NEXT_OUTPUT: export

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -oq cmdline-tools.zip
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/cmdline-tools/bin" >> $GITHUB_PATH
        working-directory: /tmp

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Verify Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Capacitor CLI
        working-directory: website
        run: npm install -D @capacitor/cli @capacitor/android @capacitor/core

      - name: Add Android platform
        working-directory: website
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: website
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: website/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: website/android/app/build/outputs/apk/debug/app-debug.apk
