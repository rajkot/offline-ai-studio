<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-mask-large" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glow-grad-mask-large" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow-mask-large" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Plain background, no border -->
  <rect width="512" height="512" fill="url(#bg-grad-mask-large)" />
  
  <!-- Centered safe-zone group -->
  <g transform="translate(64, 64)" filter="url(#glow-mask-large)">
    <!-- Code symbol </> shape -->
    <path d="M 100 144 L 60 184 L 100 224" fill="none" stroke="url(#glow-grad-mask-large)" stroke-width="17.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 218 144 L 258 184 L 218 224" fill="none" stroke="url(#glow-grad-mask-large)" stroke-width="17.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 181 123 L 141 245" fill="none" stroke="url(#glow-grad-mask-large)" stroke-width="17.5" stroke-linecap="round" />
    
    <!-- Glow beacon -->
    <circle cx="266" cy="64" r="13" fill="#10b981" />
  </g>
</svg>
