<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glow-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow-mask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Plain background, no border, as it will be clipped/masked dynamically -->
  <rect width="192" height="192" fill="url(#bg-grad-mask)" />
  
  <!-- Centered safe-zone group (within central 110px) -->
  <g transform="translate(24, 24)" filter="url(#glow-mask)">
    <!-- Code symbol </> shape -->
    <path d="M 38 54 L 23 69 L 38 84" fill="none" stroke="url(#glow-grad-mask)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 82 54 L 97 69 L 82 84" fill="none" stroke="url(#glow-grad-mask)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 68 46 L 53 92" fill="none" stroke="url(#glow-grad-mask)" stroke-width="6.5" stroke-linecap="round" />
    
    <!-- Glow beacon -->
    <circle cx="100" cy="24" r="5" fill="#10b981" />
  </g>
</svg>
