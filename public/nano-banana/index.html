<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍌 Nano Banana Pro — 2,500 AI Image Generation Prompts</title>
  <meta name="description" content="Explore 2,500 hand-curated AI image generation prompts with live search, category filtering, one-click copy, and IDE integration." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍌</text></svg>" />
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-glow: rgba(245, 158, 11, 0.25);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Ambient background gradient */
    .ambient-glow {
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(16px);
      background: rgba(9, 9, 11, 0.85);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 24px;
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      font-size: 32px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(4deg); }
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 60%, #ea580c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #d4d4d8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-num {
      color: var(--accent);
      font-weight: 700;
    }

    .controls-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .search-input {
      width: 100%;
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px 10px 42px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
    }

    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .filter-tab {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .filter-tab:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .filter-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    main {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.6);
    }

    .card-img-wrap {
      position: relative;
      height: 180px;
      overflow: hidden;
      background: #18181b;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img {
      transform: scale(1.06);
    }

    .card-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .card-fallback span {
      font-size: 38px;
    }

    .badge-category {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fbbf24;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .card-content-preview {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #e4e4e7;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
      user-select: all;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: auto;
      gap: 6px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: #d4d4d8;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn-copy {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .btn-copy:hover {
      background: var(--accent-hover);
      color: #000;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #18181b;
      border: 1px solid var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    #toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Loading state */
    .loader-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0;
      gap: 16px;
    }

    .loader-banana {
      font-size: 54px;
      animation: float 2s ease-in-out infinite;
    }

    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 36px;
    }

    .btn-page {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-page:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #121214;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <header>
    <div class="header-inner">
      <div class="top-bar">
        <a href="#" class="brand">
          <span class="brand-icon">🍌</span>
          <div>
            <div class="brand-title">Nano Banana Pro</div>
            <div class="brand-subtitle">2,500 Curated AI Image Generation Prompts</div>
          </div>
        </a>

        <div class="stats-pills">
          <div class="stat-pill">Total: <span id="stat-total" class="stat-num">2,500</span></div>
          <div class="stat-pill">Filtered: <span id="stat-filtered" class="stat-num">2,500</span></div>
          <div class="stat-pill">Status: <span class="stat-num" style="color: #10b981;">● Air-Gapped Ready</span></div>
        </div>
      </div>

      <div class="controls-bar">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search 2,500 prompts by keyword, subject, style, or camera..."
          />
        </div>

        <div class="filter-tabs" id="category-tabs">
          <button class="filter-tab active" data-cat="All">All (2,500)</button>
          <button class="filter-tab" data-cat="Nano Banana Pro">Nano Banana Pro (1,942)</button>
          <button class="filter-tab" data-cat="GPT Image 1.5">GPT Image 1.5 (256)</button>
          <button class="filter-tab" data-cat="General">General (189)</button>
          <button class="filter-tab" data-cat="Seedream 4.5">Seedream 4.5 (113)</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="loader" class="loader-wrap">
      <div class="loader-banana">🍌</div>
      <p style="color: var(--text-muted); font-size: 14px;">Loading 2,500 AI image generation prompts...</p>
    </div>

    <div id="grid" class="grid" style="display: none;"></div>

    <div id="pagination" class="pagination-bar" style="display: none;">
      <button id="btn-prev" class="btn-page">← Previous</button>
      <span id="page-indicator" style="font-size: 13px; color: var(--text-muted);">Page 1 of 50</span>
      <button id="btn-next" class="btn-page">Next →</button>
    </div>
  </main>

  <div id="toast">📋 Copied prompt to clipboard!</div>

  <!-- Detail Modal -->
  <div id="modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title" style="font-size: 18px; font-weight: 700; color: #fff;"></h3>
        <button id="modal-close" class="close-btn">&times;</button>
      </div>
      <div id="modal-img-wrap" style="height: 280px; border-radius: 10px; overflow: hidden; background: #000;">
        <img id="modal-img" src="" alt="" style="width: 100%; height: 100%; object-fit: contain;" />
      </div>
      <div>
        <h4 style="font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px;">Prompt Content</h4>
        <pre id="modal-content" style="background: rgba(0,0,0,0.5); padding: 14px; border-radius: 8px; font-size: 13px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, monospace; color: #f4f4f5;"></pre>
      </div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px;">
        <button id="modal-btn-insert" class="btn-action">📝 Insert in Monaco Editor</button>
        <button id="modal-btn-chat" class="btn-action">💬 Send to AI Chat</button>
        <button id="modal-btn-copy" class="btn-action btn-copy">📋 Copy Full Prompt</button>
      </div>
    </div>
  </div>

  <script>
    const GRADIENTS = [
      ['#e94560', '#ff6b6b'],
      ['#0f3460', '#16213e'],
      ['#ffa726', '#ff7043'],
      ['#42a5f5', '#7c4dff'],
      ['#66bb6a', '#26a69a'],
      ['#ec407a', '#ab47bc']
    ];

    let allPrompts = [];
    let filteredPrompts = [];
    let currentCategory = 'All';
    let searchQuery = '';
    let currentPage = 1;
    const pageSize = 48;
    let selectedPrompt = null;

    const loader = document.getElementById('loader');
    const grid = document.getElementById('grid');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('search-input');
    const categoryTabs = document.getElementById('category-tabs');
    const statTotal = document.getElementById('stat-total');
    const statFiltered = document.getElementById('stat-filtered');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const pageIndicator = document.getElementById('page-indicator');
    const toast = document.getElementById('toast');

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalImg = document.getElementById('modal-img');
    const modalContent = document.getElementById('modal-content');
    const modalClose = document.getElementById('modal-close');
    const modalBtnCopy = document.getElementById('modal-btn-copy');
    const modalBtnInsert = document.getElementById('modal-btn-insert');
    const modalBtnChat = document.getElementById('modal-btn-chat');

    function showToast(msg) {
      toast.textContent = msg || '📋 Copied prompt to clipboard!';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    async function copyToClipboard(text, customMsg) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(customMsg || '📋 Copied prompt to clipboard!');
      } catch (err) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(customMsg || '📋 Copied prompt to clipboard!');
      }
    }

    function sendToParent(type, prompt) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type, prompt }, '*');
        showToast(`Sent prompt to IDE (${type === 'INSERT_IN_EDITOR' ? 'Monaco' : 'AI Chat'})!`);
      } else {
        copyToClipboard(prompt.content, 'Copied! (Paste into IDE)');
      }
    }

    async function init() {
      try {
        const res = await fetch('/nano-banana-prompts.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allPrompts = data.prompts || [];
        statTotal.textContent = allPrompts.length.toLocaleString();
        applyFilters();
      } catch (err) {
        console.error('Failed to load prompts JSON:', err);
        loader.innerHTML = `
          <div style="font-size: 32px;">⚠️</div>
          <p style="color: #ef4444;">Could not load /nano-banana-prompts.json</p>
          <button onclick="location.reload()" class="btn-action" style="margin-top: 10px;">Retry</button>
        `;
      }
    }

    function applyFilters() {
      const q = searchQuery.toLowerCase().trim();
      filteredPrompts = allPrompts.filter(p => {
        if (currentCategory !== 'All' && p.category !== currentCategory) return false;
        if (!q) return true;
        return (
          (p.title && p.title.toLowerCase().includes(q)) ||
          (p.description && p.description.toLowerCase().includes(q)) ||
          (p.content && p.content.toLowerCase().includes(q))
        );
      });

      statFiltered.textContent = filteredPrompts.length.toLocaleString();
      currentPage = 1;
      renderGrid();
    }

    function renderGrid() {
      loader.style.display = 'none';
      grid.style.display = 'grid';
      pagination.style.display = 'flex';

      const totalPages = Math.ceil(filteredPrompts.length / pageSize) || 1;
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageItems = filteredPrompts.slice(start, end);

      grid.innerHTML = '';

      if (pageItems.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0; color: var(--text-muted);">
            <div style="font-size: 40px; margin-bottom: 12px;">🍌</div>
            <p style="font-size: 16px; font-weight: 600;">No prompts found matching "${searchQuery}"</p>
            <p style="font-size: 13px; margin-top: 4px;">Try searching for a different keyword or selecting "All"</p>
          </div>
        `;
      } else {
        pageItems.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          const grad = GRADIENTS[p.id % GRADIENTS.length];

          card.innerHTML = `
            <div class="card-img-wrap" style="background: linear-gradient(135deg, ${grad[0]}33, ${grad[1]}33);">
              <img
                src="${p.image}"
                alt="${p.title}"
                class="card-img"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
              />
              <div class="card-fallback" style="display: none; background: linear-gradient(135deg, ${grad[0]}, ${grad[1]});">
                <span>🍌</span>
                <span style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: rgba(255,255,255,0.8);">${p.category}</span>
              </div>
              <span class="badge-category">${p.category}</span>
            </div>
            <div class="card-body">
              <div class="card-title">${p.title || 'Untitled Prompt'}</div>
              <div class="card-desc">${p.description || ''}</div>
              <div class="card-content-preview">${p.content}</div>
              <div class="card-footer">
                <button class="btn-action btn-inspect" title="Inspect details">🔍 View</button>
                <div style="display: flex; gap: 4px;">
                  <button class="btn-action btn-insert-ed" title="Insert in active Monaco document">📝 Editor</button>
                  <button class="btn-action btn-insert-chat" title="Send to AI Assistant">💬 Chat</button>
                  <button class="btn-action btn-copy btn-copy-card" title="Copy to clipboard">📋 Copy</button>
                </div>
              </div>
            </div>
          `;

          // Handlers
          card.querySelector('.btn-inspect').addEventListener('click', () => openModal(p));
          card.querySelector('.btn-insert-ed').addEventListener('click', () => sendToParent('INSERT_IN_EDITOR', p));
          card.querySelector('.btn-insert-chat').addEventListener('click', () => sendToParent('INSERT_IN_CHAT', p));
          card.querySelector('.btn-copy-card').addEventListener('click', () => copyToClipboard(p.content));
          card.querySelector('.card-img-wrap').addEventListener('click', () => openModal(p));

          grid.appendChild(card);
        });
      }

      pageIndicator.textContent = `Page ${currentPage} of ${totalPages}`;
      btnPrev.disabled = currentPage <= 1;
      btnNext.disabled = currentPage >= totalPages;
    }

    function openModal(p) {
      selectedPrompt = p;
      modalTitle.textContent = p.title || 'Prompt Details';
      modalImg.src = p.image;
      modalContent.textContent = p.content;
      modal.classList.add('active');
    }

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    modalBtnCopy.addEventListener('click', () => {
      if (selectedPrompt) copyToClipboard(selectedPrompt.content);
    });

    modalBtnInsert.addEventListener('click', () => {
      if (selectedPrompt) sendToParent('INSERT_IN_EDITOR', selectedPrompt);
    });

    modalBtnChat.addEventListener('click', () => {
      if (selectedPrompt) sendToParent('INSERT_IN_CHAT', selectedPrompt);
    });

    // Pagination
    btnPrev.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    btnNext.addEventListener('click', () => {
      const totalPages = Math.ceil(filteredPrompts.length / pageSize);
      if (currentPage < totalPages) {
        currentPage++;
        renderGrid();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // Search debounce
    let searchTimer = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value;
        applyFilters();
      }, 250);
    });

    // Category Tabs
    categoryTabs.addEventListener('click', (e) => {
      const tab = e.target.closest('.filter-tab');
      if (!tab) return;
      categoryTabs.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCategory = tab.dataset.cat;
      applyFilters();
    });

    // Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        modal.classList.remove('active');
      }
    });

    init();
  </script>
</body>
</html>
