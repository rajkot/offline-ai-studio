name: Build Standalone Installables (Windows, macOS, Linux)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build Standalone (${{ matrix.os }} - ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: OfflineAIStudio-Windows-x64
            target_flag: --win
          - os: macos-latest
            platform: macos
            artifact_name: OfflineAIStudio-macOS-Universal
            target_flag: --mac
          - os: ubuntu-latest
            platform: linux
            artifact_name: OfflineAIStudio-Linux-x64
            target_flag: --linux

    env:
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Verify Web & Engine Build
        run: npm run build

      - name: Build Full Standalone Installables (${{ matrix.platform }})
        run: node scripts/build-standalone-exe.js ${{ matrix.target_flag }}

      - name: Upload Windows Standalone Installables (.exe, .zip)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            public/release/*.exe
            public/release/*Windows*.zip
            public/release/*Source*.zip
          if-no-files-found: error

      - name: Upload macOS Standalone Installables (.dmg, .zip)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            public/release/*.dmg
            public/release/*macOS*.zip
            public/release/*Source*.zip
          if-no-files-found: error

      - name: Upload Linux Standalone Installables (.AppImage, .deb, .tar.gz)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            public/release/*.AppImage
            public/release/*.deb
            public/release/*Linux*.tar.gz
            public/release/*Source*.zip
          if-no-files-found: error
